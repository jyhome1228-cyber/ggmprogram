name: Test Cafe24 Real Orders
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test-real-orders.yml'
      - 'scripts/test-cafe24-orders.mjs'
permissions:
  contents: read
jobs:
  test-order:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify actual order, recipient, and shipment API
        env:
          CAFE24_CLIENT_ID: ${{ secrets.CAFE24_CLIENT_ID }}
          CAFE24_CLIENT_SECRET: ${{ secrets.CAFE24_CLIENT_SECRET }}
          CAFE24_MALL_ID: ${{ secrets.CAFE24_MALL_ID }}
          FIREBASE_SERVICE_ACCOUNT_GGMAPI: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GGMAPI }}
        run: node scripts/test-cafe24-orders.mjs
