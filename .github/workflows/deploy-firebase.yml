name: Deploy Cafe24 Firebase API
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-firebase.yml'
      - 'functions/**'
      - 'firebase.json'
      - '.firebaserc'
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify required GitHub Secrets
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GGMAPI }}
          CAFE_CLIENT_ID: ${{ secrets.CAFE24_CLIENT_ID }}
          CAFE_CLIENT_SECRET: ${{ secrets.CAFE24_CLIENT_SECRET }}
          ADMIN_PASSWORD: ${{ secrets.GGM_ADMIN_UID }}
        run: |
          set -euo pipefail
          test -n "$FIREBASE_SA" || { echo "Missing FIREBASE_SERVICE_ACCOUNT_GGMAPI"; exit 1; }
          test -n "$CAFE_CLIENT_ID" || { echo "Missing CAFE24_CLIENT_ID"; exit 1; }
          test -n "$CAFE_CLIENT_SECRET" || { echo "Missing CAFE24_CLIENT_SECRET"; exit 1; }
          test -n "$ADMIN_PASSWORD" || { echo "Missing GGM_ADMIN_UID"; exit 1; }
      - name: Install Firebase tools and function packages
        run: |
          npm install --no-audit --no-fund --prefix functions
          npm install --global firebase-tools
      - name: Authenticate and deploy functions
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GGMAPI }}
          CAFE_CLIENT_ID: ${{ secrets.CAFE24_CLIENT_ID }}
          CAFE_CLIENT_SECRET: ${{ secrets.CAFE24_CLIENT_SECRET }}
          ADMIN_PASSWORD: ${{ secrets.GGM_ADMIN_UID }}
          CI: 'true'
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$FIREBASE_SA" > "$RUNNER_TEMP/firebase-service-account.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-service-account.json"
          printf '%s' "$CAFE_CLIENT_ID" > "$RUNNER_TEMP/cafe-id.txt"
          printf '%s' "$CAFE_CLIENT_SECRET" > "$RUNNER_TEMP/cafe-secret.txt"
          printf '%s' "$ADMIN_PASSWORD" > "$RUNNER_TEMP/ggm-password.txt"
          firebase functions:secrets:set CAFE24_CLIENT_ID --data-file "$RUNNER_TEMP/cafe-id.txt" --project ggmapi-e15be
          firebase functions:secrets:set CAFE24_CLIENT_SECRET --data-file "$RUNNER_TEMP/cafe-secret.txt" --project ggmapi-e15be
          firebase functions:secrets:set GGM_ADMIN_PASSWORD --data-file "$RUNNER_TEMP/ggm-password.txt" --project ggmapi-e15be
          firebase deploy --only functions --project ggmapi-e15be --non-interactive
