name: Deploy Firebase Cafe24 API

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'functions/**'
      - 'firebase.json'
      - '.github/workflows/firebase-functions.yml'

permissions:
  contents: read

jobs:
  deploy-api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Functions source syntax
        run: node --check functions/index.js
      - name: Check required configuration (no values printed)
        env:
          GCP_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GGMAPI }}
          CAFE_ID: ${{ secrets.CAFE24_CLIENT_ID }}
          CAFE_SECRET: ${{ secrets.CAFE24_CLIENT_SECRET }}
          CAFE_MALL: ${{ secrets.CAFE24_MALL_ID }}
          ADMIN_UID: ${{ secrets.GGM_ADMIN_UID }}
        run: |
          for name in GCP_JSON CAFE_ID CAFE_SECRET CAFE_MALL ADMIN_UID; do
            if [ -z "${!name}" ]; then
              echo "::error::GitHub repository secret for $name is empty or unavailable. Check Settings > Secrets and variables > Actions > Repository secrets; use a NEW Run workflow after saving."
              exit 1
            fi
          done
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GGMAPI }}
          create_credentials_file: true
          export_environment_variables: true
      - name: Setup Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2
      - name: Diagnose service-account API permissions
        env:
          DEPLOY_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GGMAPI }}
        run: |
          python3 - <<'PY'
          import json, os
          account = json.loads(os.environ["DEPLOY_JSON"])["client_email"]
          print("Deployment service account: " + account)
          print("Project: ggmapi-e15be")
          PY
          if ! gcloud services describe secretmanager.googleapis.com --project=ggmapi-e15be --format='value(state)'; then
            echo "::error::The service account printed above cannot read the Secret Manager API service state. Grant roles/serviceusage.serviceUsageViewer on project ggmapi-e15be to THAT exact service account, not a different Firebase agent, and verify its key matches the GitHub secret. Secret Manager Admin alone does not grant serviceusage.services.get."
            exit 1
          fi
      - name: Install Firebase CLI and dependencies
        run: |
          npm install --global firebase-tools
          npm --prefix functions install --no-audit --no-fund
      - name: Set server-only parameters
        env:
          CAFE24_MALL_ID: ${{ secrets.CAFE24_MALL_ID }}
          GGM_ADMIN_UID: ${{ secrets.GGM_ADMIN_UID }}
        run: |
          printf 'CAFE24_MALL_ID=%s\nGGM_ADMIN_UID=%s\n' "$CAFE24_MALL_ID" "$GGM_ADMIN_UID" > functions/.env.ggmapi-e15be
          chmod 600 functions/.env.ggmapi-e15be
      - name: Provision Cafe24 secrets
        env:
          CAFE24_CLIENT_ID: ${{ secrets.CAFE24_CLIENT_ID }}
          CAFE24_CLIENT_SECRET: ${{ secrets.CAFE24_CLIENT_SECRET }}
        run: |
          mkdir -p .secrets
          chmod 700 .secrets
          printf '%s' "$CAFE24_CLIENT_ID" > .secrets/client-id
          printf '%s' "$CAFE24_CLIENT_SECRET" > .secrets/client-secret
          firebase functions:secrets:set CAFE24_CLIENT_ID --data-file .secrets/client-id --project ggmapi-e15be --non-interactive
          firebase functions:secrets:set CAFE24_CLIENT_SECRET --data-file .secrets/client-secret --project ggmapi-e15be --non-interactive
          rm -rf .secrets
      - name: Deploy Firebase API Functions
        run: firebase deploy --only functions --project ggmapi-e15be --non-interactive
