name: Cafe24 Order Sync
on:
  workflow_dispatch:
    inputs:
      history_start:
        description: 'Optional past-order start date YYYY-MM-DD (max 90 days)'
        required: false
        type: string
      history_end:
        description: 'Optional past-order end date YYYY-MM-DD'
        required: false
        type: string
      oauth_code:
        description: 'Only for first-time OAuth connection (normally leave blank)'
        required: false
        type: string
permissions:
  contents: write
concurrency:
  group: ggm-cafe24-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Collect orders and encrypted private archive
        env:
          CAFE24_CLIENT_ID: ${{ secrets.CAFE24_CLIENT_ID }}
          CAFE24_CLIENT_SECRET: ${{ secrets.CAFE24_CLIENT_SECRET }}
          CAFE24_MALL_ID: ${{ secrets.CAFE24_MALL_ID }}
          FIREBASE_SERVICE_ACCOUNT_GGMAPI: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GGMAPI }}
          GGM_ORDER_VIEW_PASSWORD: ${{ secrets.GGM_ORDER_VIEW_PASSWORD }}
          OAUTH_CODE: ${{ inputs.oauth_code }}
          HISTORY_START: ${{ inputs.history_start }}
          HISTORY_END: ${{ inputs.history_end }}
        run: node scripts/cafe24-sync.mjs
      - name: Preserve encrypted token and completed data
        if: always()
        run: |
          set -e
          git add -A -- data/oauth-token.enc data/client.json data/orders-private.enc data/summary.json
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: update encrypted orders and public aggregate [skip ci]"
          git push
