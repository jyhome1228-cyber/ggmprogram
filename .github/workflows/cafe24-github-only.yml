name: Cafe24 GitHub-only Order Sync
on:
  push:
    branches: [main]
    paths:
      - 'scripts/cafe24-sync.mjs'
      - '.github/workflows/cafe24-github-only.yml'
  workflow_dispatch:
    inputs:
      oauth_code:
        description: 'Only for first connection: short-lived Cafe24 authorization code (1 minute)'
        required: false
        type: string
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: write
concurrency:
  group: cafe24-github-only
  cancel-in-progress: false
jobs:
  orders:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Collect anonymized orders
        env:
          CAFE24_CLIENT_ID: ${{ secrets.CAFE24_CLIENT_ID }}
          CAFE24_CLIENT_SECRET: ${{ secrets.CAFE24_CLIENT_SECRET }}
          CAFE24_MALL_ID: ${{ secrets.CAFE24_MALL_ID }}
          FIREBASE_SERVICE_ACCOUNT_GGMAPI: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GGMAPI }}
          OAUTH_CODE: ${{ inputs.oauth_code }}
        run: node scripts/cafe24-sync.mjs
      - name: Commit public aggregate only
        run: |
          if [ -z "$(git status --porcelain -- data/summary.json data/oauth-token.enc data/client.json)" ]; then
            echo "No summary updates"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/summary.json data/oauth-token.enc data/client.json
          git commit -m "data: refresh anonymized Cafe24 product totals [skip ci]"
          git push
