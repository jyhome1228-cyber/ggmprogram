<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>카페24 최초 인증 | 건강미</title><style>body{font:15px -apple-system,BlinkMacSystemFont,'Noto Sans KR',sans-serif;max-width:610px;margin:55px auto;padding:20px;color:#292631}input,button{font:inherit;padding:12px;margin:8px 0;width:100%;box-sizing:border-box;border:1px solid #ddd;border-radius:8px}button{background:#735d9e;color:white;cursor:pointer}.note{background:#f4f0fa;padding:15px;border-radius:10px;line-height:1.7}code{overflow-wrap:anywhere}</style></head><body><h2>카페24 최초 연결</h2><div id="result"><p class="note">GitHub Pages 전용 최초 인증 페이지입니다. 카페24 개발자센터 Redirect URI를 이 페이지 주소로 등록한 경우에만 진행하세요.</p><label>카페24 앱 연결</label><input id="client" placeholder="Client ID 자동 확인 중"><button id="go">카페24 관리자 승인 열기</button><p>승인 이후 인증코드는 1분 내에 GitHub Actions에 전달해야 합니다.</p></div><script>
const redirect="https://jyhome1228-cyber.github.io/ggmprogram/oauth.html";
fetch("./data/client.json").then(r=>r.ok?r.json():null).then(j=>{if(j?.client_id){const input=document.getElementById("client");if(input){input.value=j.client_id;input.readOnly=true}}}).catch(()=>{});
const params=new URLSearchParams(location.search);
if(params.has("code")||params.has("error")){
 const state=params.get("state"),expected=sessionStorage.getItem("ggm_oauth_state");
 document.getElementById("result").innerHTML=params.has("error")?'<p>카페24 인증이 거부되었습니다.</p>':state&&expected&&state===expected?'<div class="note"><b>승인 성공</b><p>아래 인증코드를 복사하고 즉시 GitHub Actions에서 Cafe24 GitHub-only Order Sync → Run workflow → oauth_code에 입력하세요. 1분 내에 처리해야 합니다.</p><input id="authcode" readonly><button id="copy">인증코드 복사</button><p><a href="https://github.com/jyhome1228-cyber/ggmprogram/actions/workflows/cafe24-github-only.yml">GitHub 연결 작업 열기</a></p></div>':'<p>인증 상태가 일치하지 않습니다. 이 브라우저에서 다시 시작해주세요.</p>';
 if(params.has("code")&&state===expected){document.getElementById("authcode").value=params.get("code");document.getElementById("copy").onclick=()=>navigator.clipboard.writeText(params.get("code"))}
 history.replaceState({},'',location.pathname);
}else document.getElementById("go").onclick=()=>{
 const client=document.getElementById("client").value.trim();
 if(!client)return alert("Client ID가 필요합니다.");
 const bytes=new Uint8Array(24);crypto.getRandomValues(bytes);
 const state=Array.from(bytes,x=>x.toString(16).padStart(2,"0")).join("");
 sessionStorage.setItem("ggm_oauth_state",state);
 const p=new URLSearchParams({response_type:"code",client_id:client,redirect_uri:redirect,state,scope:"mall.read_order mall.read_product mall.read_shipping"});
 location.href="https://ggmspa.cafe24api.com/api/v2/oauth/authorize?"+p;
};
</script></body></html>
