<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>건강미 CS Manager - 카페24 연동</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7f6f9;color:#2b2730;font:14px Pretendard,-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif}.app{display:grid;grid-template-columns:210px 1fr;min-height:100vh}aside{background:white;border-right:1px solid #eeeaf1;padding:30px 18px}.logo{font-size:23px;font-weight:800;margin-bottom:35px}small{display:block;color:#9487a5;font-size:11px;letter-spacing:2px;margin-top:5px}nav{display:grid;gap:6px}button{font:inherit;cursor:pointer}nav button{text-align:left;background:transparent;border:0;padding:14px;border-radius:9px;color:#716b78}nav button.active{background:#f0eaf8;color:#71559b;font-weight:750}main{min-width:0;padding:37px;max-width:1600px;width:100%;margin:0 auto}.top{display:flex;justify-content:space-between;gap:15px;align-items:center;flex-wrap:wrap}h1{font-size:28px;margin:6px 0}h2{font-size:18px}.eyebrow{font-size:11px;letter-spacing:2px;color:#8062a5;font-weight:700}.muted{color:#8a8490;font-size:12px}.btn,input{border-radius:9px;border:1px solid #e4deea;background:white;padding:11px 13px;min-height:41px}.btn{font-size:13px;font-weight:700}.primary{background:#755da0;border-color:#755da0;color:white}.btn:disabled{opacity:.5}.filters{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin:22px 0}.filters input[type=search]{flex:1;min-width:220px}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:20px 0}.card,.panel{background:#fff;border:1px solid #eeeaf2;border-radius:15px}.card{padding:21px}.card span{font-size:12px;color:#88808f}.card b{display:block;font-size:25px;margin-top:14px}.panel{padding:21px}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:800px}th,td{padding:14px 12px;text-align:left;white-space:nowrap;font-size:12px;border-bottom:1px solid #f0edf3}th{color:#88808e;background:#faf9fc}td.num,th.num{text-align:right}.notice{border-radius:10px;background:#f1ecfa;padding:14px;margin:18px 0;color:#6a5290;font-size:13px}.error{background:#fff1f1;color:#a43939}.link{background:none;border:0;color:#73559a;text-decoration:underline;font-weight:700}.login{margin:12vh auto;background:#fff;border:1px solid #eee;border-radius:18px;padding:30px;max-width:420px}.login input,.login button{width:100%;margin:8px 0}.hide{display:none!important}@media(max-width:850px){.app{display:block}aside{padding:14px}.logo{margin-bottom:12px}nav{display:flex;overflow:auto}nav button{white-space:nowrap;font-size:12px;padding:10px}main{padding:17px}.cards{grid-template-columns:repeat(2,1fr)}.card{padding:14px}h1{font-size:24px}}
</style></head><body><div id="root"></div><script>
"use strict";
const endpoint="https://asia-northeast3-ggmapi-e15be.cloudfunctions.net";
const root=document.querySelector("#root");
const S={password:sessionStorage.getItem("ggm_cs_password")||"",view:"products",from:today(-30),to:today(0),search:"",product:null,orders:[],loading:false,error:"",connected:null};
function today(delta){const d=new Date();d.setDate(d.getDate()+delta);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function html(t){return String(t??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
const fmt=n=>Number(n||0).toLocaleString("ko-KR"),won=n=>fmt(n)+"원";
async function call(path){const r=await fetch(endpoint+path,{headers:{"X-Admin-Password":S.password},cache:"no-store"});let j=await r.json().catch(()=>({error:"응답을 읽을 수 없습니다."}));if(!r.ok)throw Error(j.error||"요청 실패 ("+r.status+")");return j}
function items(){return S.orders.flatMap(o=>(o.items||[]).map(i=>({id:o.order_id||"",date:(o.order_date||"").slice(0,10),name:i.product_name||"상품명 미확인",opt:i.option_value||i.option_name||"",qty:Number(i.quantity||0),price:Number(i.product_price||0)*Number(i.quantity||0),buyer:o.buyer?.name||o.member_id||"",status:i.order_status||o.order_status||"",tracking:i.tracking_no||"",productNo:i.product_no||"",raw:o})))}
function rows(){return items().filter(x=>(!S.product||S.product===x.name)&&(!S.search||[x.id,x.name,x.opt,x.buyer].join(" ").toLowerCase().includes(S.search.toLowerCase())))}
function products(){const map=new Map();for(const i of rows()){const key=i.name+"|"+i.productNo+"|"+i.opt;const x=map.get(key)||{name:i.name,opt:i.opt,ids:new Set(),qty:0,sum:0};x.ids.add(i.id);x.qty+=i.qty;x.sum+=i.price;map.set(key,x)}return [...map.values()].map(p=>({...p,count:p.ids.size})).sort((a,b)=>b.qty-a.qty)}
function data(){let r=rows();if(S.view==="shipping")r=r.filter(i=>!i.tracking&&!/취소|환불|반품|배송완료/.test(i.status));return r}
const tabs={products:"제품별 주문관리",orders:"전체 주문내역",shipping:"배송 확인"};
function draw(){
if(!S.password){root.innerHTML='<div class="login"><div class="eyebrow">HEALTHY BEAUTY · GGM</div><h1>건강미 관리자</h1><p class="muted">관리자 비밀번호로 접속합니다.</p><form id="auth"><input type="password" required placeholder="관리자 비밀번호"><button class="btn primary">관리자 접속</button></form></div>';document.querySelector("#auth").onsubmit=e=>{e.preventDefault();S.password=e.target.querySelector("input").value;sessionStorage.setItem("ggm_cs_password",S.password);draw();refresh()};return}
const rr=rows(),sum=rr.reduce((a,v)=>a+v.price,0),qty=rr.reduce((a,v)=>a+v.qty,0);
root.innerHTML='<div class="app"><aside><div class="logo">건강미<small>CS MANAGER</small></div><nav>'+Object.entries(tabs).map(([k,v])=>'<button data-tab="'+k+'" class="'+(S.view===k?"active":"")+'">'+v+'</button>').join("")+'</nav></aside><main><div class="top"><div><div class="eyebrow">CAFE24 · LIVE ORDERS</div><h1>'+tabs[S.view]+'</h1><div class="muted">카페24 실시간 조회 · 기간 설정 가능</div></div><div><button id="connect" class="btn">카페24 연결</button> <button id="refresh" class="btn">↻ 새로고침</button> <button id="download" class="btn primary">↓ CSV 다운로드</button> <button id="exit" class="btn">종료</button></div></div>'+(S.error?'<div class="notice error">'+html(S.error)+'</div>':'')+(S.connected===false?'<div class="notice">카페24 연결 전입니다. 상단의 카페24 연결 버튼으로 인증해주세요.</div>':'')+'<div class="filters"><input id="from" type="date" value="'+S.from+'"><span>~</span><input id="to" type="date" value="'+S.to+'"><button id="apply" class="btn">기간 적용</button><input id="search" type="search" placeholder="주문번호 · 상품명 · 고객명 검색" value="'+html(S.search)+'"></div><div class="cards">'+[['주문건수',new Set(rr.map(i=>i.id)).size+"건"],['판매수량',fmt(qty)+"개"],['상품금액(참고)',won(sum)],['송장 확인필요',rr.filter(i=>!i.tracking&&!/취소|환불|반품|배송완료/.test(i.status)).length+"개 품주"]].map(([k,v])=>'<div class="card"><span>'+k+'</span><b>'+v+'</b></div>').join('')+'</div><div class="panel"><div class="panel-head"><h2>'+(S.product?html(S.product)+" 주문상세":tabs[S.view])+'</h2>'+(S.product?'<button class="btn" id="back">전체로</button>':'')+'</div><div class="tablewrap">'+table()+'</div><p class="muted">※ 상품금액은 옵션할인·취소·부분환불이 반영되지 않은 참고값입니다. 송장 확인필요는 배송누락 확정이 아닙니다.</p></div></main></div>';
document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{S.view=b.dataset.tab;S.product=null;draw()});
document.querySelector("#exit").onclick=()=>{S.password="";S.orders=[];sessionStorage.removeItem("ggm_cs_password");draw()};
document.querySelector("#refresh").onclick=refresh;
document.querySelector("#connect").onclick=connect;
document.querySelector("#download").onclick=download;
document.querySelector("#apply").onclick=()=>{S.from=document.querySelector("#from").value;S.to=document.querySelector("#to").value;refresh()};
document.querySelector("#search").onchange=e=>{S.search=e.target.value;draw()};
document.querySelector("#back")?.addEventListener("click",()=>{S.product=null;S.view="products";draw()});
document.querySelectorAll("[data-prod]").forEach(b=>b.onclick=()=>{S.product=decodeURIComponent(b.dataset.prod);S.view="orders";draw()});
}
function table(){if(S.loading)return'<div class="notice">주문 정보를 불러오고 있습니다…</div>';if(S.view==="products"){const p=products();if(!p.length)return'<div class="notice">주문 데이터가 없습니다. 카페24 연결이나 조회 기간을 확인해주세요.</div>';return'<table><thead><tr><th>제품명</th><th>옵션</th><th class="num">주문</th><th class="num">수량</th><th class="num">상품금액</th><th>상세</th></tr></thead><tbody>'+p.map(x=>'<tr><td>'+html(x.name)+'</td><td>'+html(x.opt)+'</td><td class="num">'+x.count+'</td><td class="num">'+x.qty+'</td><td class="num">'+won(x.sum)+'</td><td><button class="link" data-prod="'+encodeURIComponent(x.name)+'">주문 보기</button></td></tr>').join('')+'</tbody></table>'}
const r=data();if(!r.length)return'<div class="notice">조회 결과가 없습니다.</div>';return'<table><thead><tr><th>주문일</th><th>주문번호</th><th>주문자</th><th>상품명</th><th>옵션</th><th class="num">수량</th><th class="num">상품금액</th><th>배송상태</th><th>송장</th></tr></thead><tbody>'+r.map(x=>'<tr><td>'+html(x.date)+'</td><td>'+html(x.id)+'</td><td>'+html(x.buyer)+'</td><td>'+html(x.name)+'</td><td>'+html(x.opt)+'</td><td class="num">'+x.qty+'</td><td class="num">'+won(x.price)+'</td><td>'+html(x.status)+'</td><td>'+html(x.tracking||"미확인")+'</td></tr>').join('')+'</tbody></table>'}
async function refresh(){S.loading=true;S.error="";draw();try{const j=await call("/cafe24Orders?from="+S.from+"&to="+S.to);S.orders=j.orders||[];S.connected=true;if(!j.complete)S.error="주문이 1,000건 이상입니다. 기간을 줄여 다시 조회해주세요.";}catch(e){S.orders=[];S.error=e.message;S.connected=/인증 연결/.test(e.message)?false:S.connected;if(/비밀번호/.test(e.message)){S.password="";sessionStorage.removeItem("ggm_cs_password")}}finally{S.loading=false;draw()}}
async function connect(){try{const j=await call("/cafe24Start");location.href=j.url}catch(e){S.error=e.message;draw()}}
function csvCell(v){let x=String(v??"");if(/^[=+@\-]/.test(x))x="'"+x;return '"'+x.replace(/"/g,'""')+'"'}
function download(){let r;if(S.view==="products")r=products().map(p=>[p.name,p.opt,p.count,p.qty,p.sum]);else r=data().map(x=>[x.date,x.id,x.buyer,x.name,x.opt,x.qty,x.price,x.status,x.tracking]);const keys=S.view==="products"?["상품명","옵션","주문건수","판매수량","상품금액(참고)"]:["주문일","주문번호","주문자","상품명","옵션","수량","상품금액(참고)","배송상태","송장번호"];if(!r.length)return alert("다운로드할 주문이 없습니다.");const content="\uFEFF"+[keys,...r].map(row=>row.map(csvCell).join(",")).join("\r\n");const url=URL.createObjectURL(new Blob([content],{type:"text/csv;charset=utf-8"}));const a=document.createElement("a");a.href=url;a.download="건강미_"+tabs[S.view]+"_"+today(0)+".csv";a.click();setTimeout(()=>URL.revokeObjectURL(url),500)}
draw();if(S.password)refresh();
</script></body></html>
