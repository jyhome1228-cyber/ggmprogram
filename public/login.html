<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>건강미 GGM OPS | 로그인</title>
<link rel="icon" type="image/svg+xml" href="/assets/geonganmi-mark.svg">
<style>
:root{--brand:#667f89;--text:#2b424b;--line:#dbe5e7;--bg:#f5f8f8}*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);font:14px/1.55 Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);display:grid;place-items:center;padding:20px}
.card{width:min(440px,100%);padding:38px 36px 34px;border:1px solid var(--line);border-radius:18px;background:#fff;box-shadow:0 15px 45px #42596216}
.logo{display:flex;justify-content:center;align-items:center;gap:9px}.logo img:first-child{width:58px;height:82px;object-fit:contain}.logo img:last-child{width:171px;height:46px;object-fit:contain}
.eyebrow{text-align:center;color:#849ca5;font-size:10px;font-weight:750;letter-spacing:1.8px;margin-top:12px}
h1{text-align:center;margin:30px 0 3px;font-size:24px;letter-spacing:-.6px}
.description{text-align:center;color:#85969e;font-size:13px;margin:0 0 27px}
label{font-size:12px;color:#58737b;font-weight:700;display:block;margin-bottom:8px}
input{border:1px solid var(--line);border-radius:9px;width:100%;padding:11px 13px;min-height:47px;font:inherit;outline:none}
input:focus{border-color:var(--brand);box-shadow:0 0 0 3px #667f8920}
button{font:inherit;cursor:pointer}
.primary{background:var(--brand);border:0;color:white;border-radius:9px;padding:13px;min-height:47px;width:100%;font-weight:750;margin-top:20px}
.primary:disabled{opacity:.55;cursor:default}
.secondary{background:#edf4f4;color:#4d6973;border:0;border-radius:8px;padding:10px;width:100%;margin-top:12px;font-weight:700}
.status{min-height:22px;text-align:center;margin-top:13px;font-size:12px;color:#648089;line-height:1.7}.status.error{color:#b34e4e}
.foot{border-top:1px solid var(--line);padding-top:21px;margin-top:24px;font-size:11px;color:#8d9fa7;text-align:center;line-height:1.7}
[hidden]{display:none!important}
</style></head><body><main class="card">
<div class="logo"><img src="/assets/geonganmi-mark.svg" alt=""><img src="/assets/geonganmi-wordmark.svg" alt="GEONGANMI"></div>
<div class="eyebrow">GGM OPS · TEST ACCESS</div><h1>건강미 로그인</h1><p class="description">건강미 운영관리 시스템</p>
<form id="form" hidden>
<label for="password">공통 비밀번호</label>
<input id="password" type="password" autocomplete="current-password" required>
<button type="submit" class="primary" id="login">관리자 프로그램 열기</button>
</form>
<button id="open" class="primary" type="button" hidden>주문 대시보드 열기</button>
<button id="logout" class="secondary" type="button" hidden>로그아웃</button>
<div id="status" class="status" role="status" aria-live="polite">로그인 상태 확인 중…</div>
<div class="foot">Cloudflare 서버는 NINEWORKS가 관리합니다.<div>개발 테스트용 관리자 접근 화면입니다.</div></div>
</main><script>
(() => {
'use strict';
const el=id=>document.getElementById(id);
const status=el('status'),form=el('form'),button=el('login'),open=el('open'),logout=el('logout');
function info(message,error=false){status.textContent=message;status.classList.toggle('error',error)}
function show(logged){
 form.hidden=logged;open.hidden=!logged;logout.hidden=!logged;
 button.disabled=false;open.disabled=false;
 info(logged?'로그인 상태가 유지되고 있습니다. 주문 대시보드로 이동할 수 있습니다.':'공통 비밀번호를 입력해주세요.');
}
async function session(){
 try{
  const result=await fetch('/auth/shared/me',{credentials:'same-origin',cache:'no-store'});
  show(result.ok);
 }catch{show(false);info('인증 상태 확인에 실패했습니다. 다시 로그인해주세요.',true)}
}
async function submit(e){
 e.preventDefault();button.disabled=true;info('비밀번호 확인 중…');
 try {
  const response=await fetch('/auth/shared/login',{method:'POST',credentials:'same-origin',
   headers:{'Content-Type':'application/json'},body:JSON.stringify({password:el('password').value})});
  const result=await response.json().catch(()=>({}));
  if(!response.ok)throw Error(result.error||'비밀번호 확인 실패');
  const verified=await fetch('/auth/shared/me',{credentials:'same-origin',cache:'no-store'});
  if(!verified.ok)throw Error('로그인 세션이 저장되지 않았습니다.');
  el('password').value='';
  show(true);
 }catch(err){info(err.message,true);button.disabled=false}
}
form.addEventListener('submit',submit);
open.addEventListener('click',()=>{open.disabled=true;location.assign('/')});
logout.addEventListener('click',async()=>{
 logout.disabled=true;
 try{await fetch('/auth/shared/logout',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:'{}'})}
 finally{logout.disabled=false;show(false);el('password').focus()}
});
session();
})();
</script></body></html>
