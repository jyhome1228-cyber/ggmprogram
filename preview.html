<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>건강미 CS Manager | 미리보기</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f6f9;color:#292631;font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif;font-size:14px}button,input,select{font:inherit}button{cursor:pointer}.layout{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100vh}aside{background:#fff;border-right:1px solid #eae8ed;padding:28px 16px}.logo{font-size:24px;font-weight:850;letter-spacing:-1.5px;padding:0 11px 35px}.logo span{display:block;color:#8b7ba8;font-size:10px;letter-spacing:2px;margin-top:6px}nav{display:grid;gap:7px}nav button{text-align:left;border:0;border-radius:10px;background:transparent;color:#77717e;padding:13px 15px}nav button.active{color:#6d5497;background:#efeaf7;font-weight:750}main{padding:36px;min-width:0;max-width:1600px;width:100%;margin:0 auto}.heading{display:flex;align-items:start;justify-content:space-between;flex-wrap:wrap;gap:12px}.overline{font-size:11px;color:#8066aa;font-weight:750;letter-spacing:2px}h1{font-size:28px;letter-spacing:-1px;margin:10px 0 6px}.muted{color:#8b8691;font-size:12px}.chip{background:#efeaf7;color:#745990;border-radius:999px;padding:7px 12px;font-size:12px;font-weight:700}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:26px 0}.card,.panel{background:#fff;border:1px solid #eeeaf1;border-radius:16px}.card{padding:23px 19px}.card label{color:#8b8494;font-size:12px}.card b{display:block;font-size:26px;letter-spacing:-1px;margin-top:14px}.panel{padding:22px;margin-top:17px}.paneltop{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:18px}h2{font-size:17px;margin:0}.controls{display:flex;flex-wrap:wrap;gap:8px;margin-top:24px;align-items:center}.btn{padding:11px 14px;border:1px solid #e5e0ea;background:white;color:#443b4f;border-radius:9px;font-size:12px;font-weight:700}.primary{background:#745a9d;border-color:#745a9d;color:#fff}.input{border-radius:9px;border:1px solid #e5e0ea;background:#fff;padding:10px 12px;min-height:40px}.search{min-width:235px;flex:1}.tablewrap{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:820px;text-align:left}th,td{padding:15px 11px;border-bottom:1px solid #f0edf2;white-space:nowrap;font-size:12px}th{background:#faf9fc;color:#8b8494;font-weight:650}.right{text-align:right}.link{color:#705493;background:transparent;border:0;font-weight:800;padding:5px}.badge{background:#f3edf9;color:#765c98;padding:6px 9px;border-radius:6px;font-size:11px}.subtle{color:#817c87}.notice{padding:14px 17px;background:#f1ecf7;color:#6d588d;border-radius:11px;margin-top:20px;font-size:12px}.empty{text-align:center;padding:50px 0;color:#999}.inline{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.bottom{margin-top:16px;color:#98929e;font-size:11px}.detail{background:#f9f7fc;border-radius:12px;padding:15px;margin-bottom:15px;display:flex;align-items:center;justify-content:space-between;gap:10px}.mobile{display:none}
@media(max-width:900px){.layout{display:block}aside{position:sticky;top:0;z-index:5;padding:13px 16px}.logo{padding:0 0 10px;font-size:19px}.logo span{display:inline;margin-left:10px}nav{display:flex;overflow:auto}nav button{white-space:nowrap;font-size:12px;padding:10px}main{padding:20px}.cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.card{padding:17px}.card b{font-size:22px}.panel{padding:15px}h1{font-size:23px}}
</style></head><body><div class="layout"><aside><div class="logo">건강미<span>CS MANAGER</span></div><nav id="nav"></nav></aside><main><div class="heading"><div><div class="overline">GGM · ORDER MANAGEMENT</div><h1 id="title">제품별 주문관리</h1><div class="muted">건강미 주문·배송 통합관리 시스템</div></div><div class="inline"><span class="chip">● 화면 미리보기</span><button class="btn" id="download">↓ 엑셀 다운로드</button></div></div><div class="notice">현재는 <b>가상 주문 8건으로 작동하는 디자인 미리보기</b>입니다. 실제 카페24 주문·고객 정보와 연결되지 않았습니다.</div><div class="controls"><select class="input" id="period"><option value="all">전체 기간</option><option value="today">오늘</option><option value="week">최근 7일</option></select><input class="input search" id="search" placeholder="상품명 · 옵션 · 주문번호 · 고객명 검색"><button class="btn" id="reset">초기화</button></div><div class="cards" id="metrics"></div><section class="panel"><div class="paneltop"><h2 id="tableTitle">제품별 판매 현황</h2><span class="chip" id="count">0개 제품</span></div><div id="selected"></div><div class="tablewrap" id="table"></div><div class="bottom">※ 수량·금액은 미리보기용 가상 정보입니다. 다운로드는 현재 화면의 데이터를 CSV로 저장합니다.</div></section></main></div>
<script>
const today=new Date().toISOString().slice(0,10),yesterday=new Date(Date.now()-864e5).toISOString().slice(0,10),past=new Date(Date.now()-10*864e5).toISOString().slice(0,10);
const orders=[
{id:'20261109-001',date:today,buyer:'김민지',product:'페이스푸드 레귤러 세럼',option:'레귤러 2개',qty:2,amount:139000,status:'배송완료',tracking:'1234-5678',cs:''},
{id:'20261109-002',date:today,buyer:'이서연',product:'페이스푸드 마일드 세럼',option:'마일드 1개',qty:1,amount:69000,status:'배송대기',tracking:'',cs:'배송문의'},
{id:'20261109-003',date:today,buyer:'박지현',product:'건강미 욕세럼',option:'기본 2개',qty:2,amount:118000,status:'배송중',tracking:'6789-1234',cs:''},
{id:'20261109-004',date:today,buyer:'최유진',product:'페이스푸드 슈퍼 세럼',option:'슈퍼 1개',qty:1,amount:89000,status:'배송대기',tracking:'',cs:''},
{id:'20261108-005',date:yesterday,buyer:'정다은',product:'페이스푸드 레귤러 세럼',option:'레귤러 1개',qty:1,amount:69000,status:'배송완료',tracking:'9876-1234',cs:''},
{id:'20261108-006',date:yesterday,buyer:'오민서',product:'건강미 욕세럼',option:'기본 1개',qty:1,amount:59000,status:'배송대기',tracking:'',cs:'상품누락'},
{id:'20261108-007',date:yesterday,buyer:'한서진',product:'페이스푸드 마일드 세럼',option:'마일드 2개',qty:2,amount:129000,status:'배송중',tracking:'4652-1287',cs:''},
{id:'20261030-008',date:past,buyer:'홍수아',product:'페이스푸드 슈퍼 세럼',option:'슈퍼 1개',qty:1,amount:89000,status:'배송완료',tracking:'5234-7219',cs:''}
];
const menu=[['products','제품별 주문관리'],['orders','전체 주문내역'],['shipping','배송 확인'],['cs','CS 처리관리']];
let tab='products',selected='',query='',period='all';
const won=x=>(Number(x)||0).toLocaleString('ko-KR')+'원',esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function data(){return orders.filter(o=>(period==='all'||(period==='today'?o.date===today:o.date>=new Date(Date.now()-7*864e5).toISOString().slice(0,10)))&&(!query||[o.product,o.option,o.id,o.buyer].join(' ').toLowerCase().includes(query.toLowerCase()))&&(!selected||o.product===selected))}
function grouped(rows){const map=new Map();for(const o of rows){let p=map.get(o.product)||{name:o.product,ids:new Set(),qty:0,amount:0};p.ids.add(o.id);p.qty+=o.qty;p.amount+=o.amount;map.set(o.product,p)}return [...map.values()].map(p=>({...p,orders:p.ids.size})).sort((a,b)=>b.qty-a.qty)}
function dataForTab(){let r=data();if(tab==='shipping')r=r.filter(o=>o.status==='배송대기'&&!o.tracking);if(tab==='cs')r=r.filter(o=>o.cs);return r}
function view(){document.getElementById('nav').innerHTML=menu.map(m=>'<button class="'+(m[0]===tab?'active':'')+'" data-tab="'+m[0]+'">'+m[1]+'</button>').join('');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;selected='';view()});document.getElementById('title').textContent=menu.find(m=>m[0]===tab)[1];const r=data(),all=dataForTab(),g=grouped(r);document.getElementById('metrics').innerHTML=[['전체 주문',new Set(r.map(o=>o.id)).size+'건'],['판매수량',r.reduce((n,o)=>n+o.qty,0)+'개'],['주문상품 금액',won(r.reduce((n,o)=>n+o.amount,0))],['송장 미등록',r.filter(o=>o.status==='배송대기'&&!o.tracking).length+'건']].map(x=>'<div class="card"><label>'+x[0]+'</label><b>'+x[1]+'</b></div>').join('');
const labels={products:'제품별 판매 현황',orders:'전체 주문 목록',shipping:'송장 미등록 확인',cs:'CS 문의 기록'};document.getElementById('tableTitle').textContent=labels[tab];document.getElementById('count').textContent=tab==='products'?g.length+'개 제품':all.length+'건';document.getElementById('selected').innerHTML=selected?'<div class="detail"><span><b>'+esc(selected)+'</b> 주문 상세</span><button class="btn" id="clear">← 전체 제품</button></div>':'';document.getElementById('clear')?.addEventListener('click',()=>{selected='';tab='products';view()});
let html;if(tab==='products'){html='<table><thead><tr><th>제품명</th><th class="right">주문건수</th><th class="right">판매수량</th><th class="right">상품금액</th><th>상세보기</th></tr></thead><tbody>'+g.map((p,i)=>'<tr><td><b>'+esc(p.name)+'</b></td><td class="right">'+p.orders+'건</td><td class="right">'+p.qty+'개</td><td class="right">'+won(p.amount)+'</td><td><button class="link" data-item="'+i+'">주문 보기 →</button></td></tr>').join('')+'</tbody></table>'}else{html='<table><thead><tr><th>주문일</th><th>주문번호</th><th>주문자</th><th>상품명</th><th>옵션</th><th class="right">수량</th><th class="right">금액</th><th>상태</th><th>'+(tab==='cs'?'문의유형':'송장')+'</th></tr></thead><tbody>'+all.map(o=>'<tr><td>'+o.date+'</td><td>'+esc(o.id)+'</td><td>'+esc(o.buyer)+'</td><td>'+esc(o.product)+'</td><td>'+esc(o.option)+'</td><td class="right">'+o.qty+'</td><td class="right">'+won(o.amount)+'</td><td><span class="badge">'+esc(o.status)+'</span></td><td>'+esc(tab==='cs'?o.cs:(o.tracking||'미등록'))+'</td></tr>').join('')+'</tbody></table>'}document.getElementById('table').innerHTML=(tab==='products'?g:all).length?html:'<div class="empty">해당 조건에 데이터가 없습니다.</div>';document.querySelectorAll('[data-item]').forEach(b=>b.onclick=()=>{selected=g[Number(b.dataset.item)].name;tab='orders';view()});}
document.getElementById('search').oninput=e=>{query=e.target.value.trim();view()};document.getElementById('period').onchange=e=>{period=e.target.value;view()};document.getElementById('reset').onclick=()=>{tab='products';selected='';query='';period='all';document.getElementById('period').value='all';document.getElementById('search').value='';view()};
document.getElementById('download').onclick=()=>{const rows=tab==='products'?grouped(data()).map(p=>({'상품명':p.name,'주문건수':p.orders,'판매수량':p.qty,'상품금액':p.amount})):dataForTab().map(o=>({'주문일':o.date,'주문번호':o.id,'주문자':o.buyer,'상품명':o.product,'옵션':o.option,'수량':o.qty,'상품금액':o.amount,'배송상태':o.status,'송장번호':o.tracking,'CS유형':o.cs}));if(!rows.length){alert('다운로드할 데이터가 없습니다.');return}const keys=Object.keys(rows[0]);const csv='\uFEFF'+[keys,...rows.map(r=>keys.map(k=>String(r[k]??'').replace(/^[=+@\-]/,'\u0027')).map(x=>'"'+x.replace(/"/g,'""')+'"'))].map((v,i)=>i?v.join(','):v.join(',')).join('\r\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='건강미_'+menu.find(m=>m[0]===tab)[1]+'_미리보기.csv';a.click();setTimeout(()=>URL.revokeObjectURL(u),300)};
view();
</script></body></html>
