<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#667F89">
  <title>건강미 | 주문·배송 관리</title>
  <link rel="icon" type="image/svg+xml" href="./logo/geonganmi-symbol.svg">
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    *{box-sizing:border-box}body{margin:0;background:#f5f7f8;color:#27404b;font-family:Pretendard,system-ui,sans-serif}
    #root{min-height:100vh;display:grid;place-items:center;padding:28px}
    .entry{width:min(100%,560px);background:white;border:1px solid #e3ebee;border-radius:20px;padding:38px;box-shadow:0 18px 60px rgba(34,59,69,.06)}
    .identity{display:flex;gap:14px;align-items:center}.identity img{width:47px;height:67px;object-fit:contain}
    .identity strong{font-size:22px;letter-spacing:-.7px}.identity small{display:block;color:#78919a;font-size:11px;letter-spacing:1.1px;margin-top:5px}
    h1{font-size:25px;letter-spacing:-.8px;margin:35px 0 10px}p{color:#687f88;font-size:14px;line-height:1.7;margin:0 0 18px}
    a.btn{background:#557780;color:white;text-decoration:none;display:block;padding:15px;text-align:center;border-radius:9px;font-weight:700;font-size:14px}
    .notice{margin-top:17px;background:#fff8ea;color:#80613b;border:1px solid #f0e2c3;border-radius:10px;padding:14px;font-size:12px;line-height:1.7}
    .muted{font-size:12px;color:#90a1a8;text-align:center;margin-top:23px}
    @media(max-width:600px){.entry{padding:25px}h1{font-size:22px}}
  </style>
</head>
<body>
  <div id="root">
    <section class="entry">
      <div class="identity">
        <img src="./public/logo/geonganmi-symbol.svg" alt="건강미 심볼">
        <div><strong>GEONGANMI</strong><small>SHIPPING MANAGER</small></div>
      </div>
      <h1>건강미 주문·배송 관리</h1>
      <p>실제 주문 및 송장 조회는 Firebase 관리자 로그인 후 이용할 수 있습니다.</p>
      <a id="open-manager" class="btn" href="./public/manage.html">관리자 주문조회 열기</a>
      <div class="notice"><strong>실제 배송 데이터 확인 전</strong><br>카페24 OAuth 승인과 Firebase Functions 배포가 완료되어야 주문이 나타납니다. 샘플 주문을 실제 배송 건수로 표시하지 않습니다.</div>
      <div class="muted">GGM SHIPPING MANAGER · 관리자 전용</div>
    </section>
  </div>
  <script>
    // If GitHub Pages is serving the source tree rather than Vite dist, manage.html
    // is located under public/. Prefer the built version when it exists.
    fetch('./manage.html', {method:'HEAD', cache:'no-store'}).then(r=>{
      if(r.ok) document.getElementById('open-manager').href='./manage.html';
    }).catch(()=>{});
  </script>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
