<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>건강미 CS Manager | 제품별 주문현황</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7f6fa;color:#2b2931;font-family:Pretendard,-apple-system,BlinkMacSystemFont,'Noto Sans KR',Arial,sans-serif}.layout{display:grid;grid-template-columns:218px minmax(0,1fr);min-height:100vh}aside{padding:30px 18px;background:#fff;border-right:1px solid #ebe7ef}.logo{font-size:24px;font-weight:800;letter-spacing:-1px}.logo small{display:block;font-size:10px;letter-spacing:2px;color:#a393ba;margin-top:5px}.menu{margin-top:40px;padding:14px;background:#f0eaf7;border-radius:10px;color:#69518f;font-weight:700}main{padding:38px;min-width:0;max-width:1500px;width:100%;margin:auto}h1{font-size:29px;margin:8px 0}.eyebrow{color:#8062a4;font-size:11px;font-weight:800;letter-spacing:2px}.muted{font-size:13px;color:#918b98}.top{display:flex;align-items:start;justify-content:space-between;gap:15px;flex-wrap:wrap}.btn,input{padding:11px 14px;font:inherit;border:1px solid #e5dfed;border-radius:9px;background:white}.btn{font-size:13px;cursor:pointer}.primary{color:white;background:#75609d;border-color:#75609d}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin:25px 0}.card,.panel{background:white;border:1px solid #ebe8ef;border-radius:15px;padding:22px}.card span{color:#928c98;font-size:12px}.card b{display:block;font-size:26px;margin-top:12px}.panel{margin-top:18px}h2{margin:0 0 19px;font-size:18px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:600px;text-align:left}th,td{padding:14px 10px;border-bottom:1px solid #f0edf3;font-size:13px}th{color:#8d8694;background:#faf9fc;text-align:left}.right{text-align:right}.notice{border-radius:10px;padding:18px;margin:20px 0;background:#f0eaf8;color:#70558e;line-height:1.7}.controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.controls input{width:260px;max-width:100%}.timestamp{margin-top:12px;font-size:12px;color:#95909c}.hidden{display:none}@media(max-width:800px){.layout{display:block}aside{padding:18px}.menu{margin-top:12px;display:inline-block;padding:10px}main{padding:19px}.cards{gap:8px}.card{padding:14px}.card b{font-size:21px}h1{font-size:24px}.panel{padding:14px}}
</style></head><body><div class="layout"><aside><div class="logo">건강미<small>CS MANAGER</small></div><div class="menu">제품별 주문현황</div></aside><main><div class="top"><div><div class="eyebrow">CAFE24 · PRODUCT ORDERS</div><h1>제품별 주문현황</h1><div class="muted">카페24 자동 집계 · 최근 7일 · 개인정보 비공개</div></div><div class="controls"><button class="btn" id="refresh">↻ 갱신</button><button class="btn primary" id="download" disabled>↓ 엑셀용 CSV</button></div></div><div id="notice" class="notice">카페24 첫 동기화 결과를 확인하고 있습니다.</div><div class="controls"><input id="search" placeholder="제품명·옵션 검색" aria-label="제품명 검색"></div><div class="cards"><div class="card"><span>주문건수</span><b id="orders">—</b></div><div class="card"><span>제품 판매수량</span><b id="quantity">—</b></div><div class="card"><span>상품·옵션 종류</span><b id="variants">—</b></div></div><section class="panel"><h2>제품별 상세 집계</h2><div class="tablewrap"><table><thead><tr><th>제품명</th><th>옵션</th><th class="right">주문건수</th><th class="right">판매수량</th></tr></thead><tbody id="rows"><tr><td colspan="4">첫 동기화 대기 중</td></tr></tbody></table></div><p class="timestamp" id="timestamp"></p></section></main></div><script>
let data=null;
const safe=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Number(n||0).toLocaleString('ko-KR');
const el=id=>document.getElementById(id);
function draw(){if(!data)return;const q=el('search').value.trim().toLowerCase();const ps=data.products.filter(x=>(x.name+' '+x.option).toLowerCase().includes(q));el('rows').innerHTML=ps.length?ps.map(p=>'<tr><td>'+safe(p.name)+'</td><td>'+safe(p.option)+'</td><td class="right">'+fmt(p.orders)+'</td><td class="right">'+fmt(p.quantity)+'</td></tr>').join(''):'<tr><td colspan="4">검색 결과가 없습니다.</td></tr>';el('orders').textContent=fmt(data.order_count)+'건';el('quantity').textContent=fmt(data.total_quantity)+'개';el('variants').textContent=fmt(data.products.length)+'종';el('download').disabled=!ps.length}
async function load(){try{const res=await fetch('data/summary.json?x='+Date.now(),{cache:'no-store'});if(!res.ok)throw Error('동기화 데이터 없음');const j=await res.json();if(!j||!Array.isArray(j.products)||!j.updated_at)throw Error('유효하지 않은 집계 데이터');data=j;el('notice').classList.add('hidden');el('timestamp').textContent='기간: '+j.period.start_date+' ~ '+j.period.end_date+' · 최종 동기화 '+new Date(j.updated_at).toLocaleString('ko-KR');draw()}catch{data=null;el('notice').classList.remove('hidden');el('notice').textContent='아직 카페24 주문 수집이 완료되지 않았습니다. GitHub Actions에서 최초 OAuth 승인 후 첫 동기화가 성공하면 제품별 집계가 이곳에 자동 표시됩니다.';el('rows').innerHTML='<tr><td colspan="4">카페24 API 최초 연결 대기 중</td></tr>';el('download').disabled=true}}
el('search').oninput=draw;el('refresh').onclick=load;
el('download').onclick=()=>{if(!data)return;const q=el('search').value.trim().toLowerCase();const rows=data.products.filter(x=>(x.name+' '+x.option).toLowerCase().includes(q));const cell=s=>{const t=String(s??'');const safe=/^[=+@\-]/.test(t)?"'"+t:t;return '"'+safe.replace(/"/g,'""')+'"'};const csv='\uFEFF'+[['제품명','옵션','주문건수','판매수량'],...rows.map(x=>[x.name,x.option,x.orders,x.quantity])].map(r=>r.map(cell).join(',')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='건강미_제품별주문현황.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),500)};
load();
</script></body></html>
